<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дверной глазок</title>
<style>
  html { color-scheme: light dark; }
  body { font: 1rem system-ui, sans-serif; max-width: 54rem; margin: 0 auto; padding: 1rem; }
  h1 { margin-top: 0; } h2 { margin: 1.5rem 0 .6rem; }
  button, select { font: inherit; min-height: 2.75rem; padding: .35rem .6rem; max-width: 100%; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; margin: .6rem 0; }
  .row[hidden] { display: none; }
  #stage { position: relative; overflow: hidden; height: min(62vh, 34rem); background: #131a18; border-radius: .65rem; }
  #live { position: absolute; top: 50%; left: 50%; }
  #recording { display: block; width: 100%; height: 65vh; object-fit: contain; background: #131a18; border-radius: .65rem; }
  #recording[hidden] { display: none; }
  p { margin: .6rem 0; }
</style>
<script defer src="/lan.js"></script>
</head>
<body>
<main>
  <h1>Дверной глазок</h1>
  <section aria-labelledby="live-title">
    <h2 id="live-title">Прямой эфир</h2>
    <div class="row">
      <button id="toggle-live" type="button">Смотреть эфир</button>
      <p id="live-status" role="status"></p>
    </div>
    <div id="stage" hidden><video id="live" muted playsinline aria-label="Прямой эфир"></video></div>
  </section>
  <section aria-labelledby="archive-title">
    <h2 id="archive-title">Записи движения</h2>
    <div class="row">
      <label for="events">Событие</label>
      <select id="events" disabled></select>
      <button id="refresh" type="button">Обновить</button>
    </div>
    <div class="row" id="clip-row" hidden>
      <label for="clips">Фрагмент</label>
      <select id="clips"></select>
    </div>
    <p id="archive-status" role="status"></p>
    <video id="recording" controls playsinline preload="metadata" aria-label="Запись движения" hidden></video>
  </section>
</main>
</body>
</html>
