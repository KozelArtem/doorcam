<!doctype html>
<html lang="ru"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101a21"><meta name="referrer" content="no-referrer">
  <title>Глазок · Камера у двери</title><link rel="stylesheet" href="/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script type="module" src="/app.js"></script>
</head><body>
<header><div class="bar"><span class="mark" aria-hidden="true"></span><strong>Глазок</strong><button id="logout" hidden>Выйти</button></div></header>
<main>
  <section id="gate" aria-labelledby="gate-title">
    <div class="lens" aria-hidden="true"><i></i></div>
    <h1 id="gate-title">Камера у двери</h1>
    <p id="gate-message" role="status">Проверяем доступ…</p>
    <a class="accent" id="login" href="/auth/login" hidden>Войти через Telegram</a>
    <button id="retry" hidden>Попробовать снова</button>
    <noscript>Для просмотра видео включите JavaScript.</noscript>
  </section>
  <section id="dashboard" hidden>
    <div class="title"><h1>Входная дверь</h1><div class="camera-state"><span id="status" role="status">Подключение…</span><span id="capture-status" role="status"></span></div></div>
    <div class="columns"><section class="monitor" aria-labelledby="screen-title">
      <div class="screen" data-mode="idle">
        <video id="video" muted playsinline preload="auto" controls aria-label="Видео с камеры"></video>
        <video id="video-buffer" muted playsinline preload="auto" controls aria-label="Видео с камеры" hidden></video>
        <div id="screen-idle"><span class="lens small" aria-hidden="true"><i></i></span><span id="screen-hint">Ожидание камеры</span></div>
      </div>
      <div class="transport"><div><h2 id="screen-title" tabindex="-1">Прямой эфир</h2><span id="player-info" role="status"></span><span id="playback-info" role="status"></span></div>
        <button id="live" class="accent" disabled>Смотреть эфир</button>
        <button id="stop" hidden>Остановить</button>
        <a id="download" class="download" download hidden>Скачать фрагмент</a>
      </div>
      <button id="back-to-recordings" hidden>К списку записей</button>
    </section>
    <section class="history" aria-labelledby="history-title">
      <div class="history-head"><h2 id="history-title">Записи движения</h2><button id="refresh" disabled>Обновить</button></div>
      <div class="archive-filters" role="group" aria-label="День записи" hidden>
        <button id="today" aria-pressed="false">Сегодня</button>
        <button id="yesterday" aria-pressed="false">Вчера</button>
        <select id="archive-date" aria-label="Выбрать дату"></select>
      </div>
      <h3 id="archive-summary" class="date" hidden></h3>
      <p id="archive-status" role="status">Подключение к архиву…</p>
      <div class="archive-list">
        <div id="recordings"></div>
        <button id="more" hidden>Показать ещё</button>
        <button id="older" hidden>Загрузить более ранние записи</button>
      </div>
    </section></div>
  </section>
</main></body></html>
